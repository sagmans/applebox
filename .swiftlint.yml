# Fails the lint run in every caller (editor plugins, direct runs) on any other
# release, because each release can add or change rules. Range syntax such as
# ">= x" rejects even the matching release, so keep an exact value. The
# Makefile pins the same release (SWIFTLINT_VERSION); keep both in step.
swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - scripts/benchmark-search.swift
  - scripts/install-local.swift
  - scripts/icons

excluded:
  - .build
  - .swiftpm
  - DerivedData

# Start pragmatic: keep lint signal, but don't fail the build on huge-file metrics.
disabled_rules:
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name
  - large_tuple
  - line_length
  - trailing_comma
  - for_where
  - todo

# Some default rules are noisy for Swift packages / test helpers
  - compiler_protocol_init
  - opening_brace
  - redundant_discardable_let
  - force_cast
  - force_try
  - non_optional_string_data_conversion

# Prefer SwiftFormat for whitespace/indentation.
  - trailing_whitespace

