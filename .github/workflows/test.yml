name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests with coverage
        run: swift test -v --enable-code-coverage

      - name: Generate coverage report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA_PATH="${BIN_PATH}/codecov/default.profdata"
          XCTEST_PATH="${BIN_PATH}/AppleBoxPackageTests.xctest/Contents/MacOS/AppleBoxPackageTests"
          
          # Generate text report for logs
          echo "=== Code Coverage Report ==="
          xcrun llvm-cov report "$XCTEST_PATH" \
            -instr-profile="$PROFDATA_PATH" \
            -ignore-filename-regex='.build|Tests'
          
          # Extract coverage percentage for badge
          COVERAGE=$(xcrun llvm-cov report "$XCTEST_PATH" \
            -instr-profile="$PROFDATA_PATH" \
            -ignore-filename-regex='.build|Tests' 2>&1 | tail -1 | awk '{print $10}')
          
          echo "COVERAGE_PERCENT=$COVERAGE" >> $GITHUB_ENV

      - name: Generate coverage badge JSON
        run: |
          python3 scripts/coverage-badge.py

      - name: Upload coverage badge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-badge
          path: coverage-badge.json

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo ":white_check_mark: All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Some tests failed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-badge.json ]; then
            COVERAGE_MSG=$(python3 -c "import json; print(json.load(open('coverage-badge.json'))['message'])")
            echo "**Line Coverage:** $COVERAGE_MSG" >> $GITHUB_STEP_SUMMARY
          fi
