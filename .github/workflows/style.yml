name: Code Style

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  style:
    name: SwiftFormat + SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Exact tool versions, checksum-verified, so `make format-check` and
      # `make lint` do not drift when Homebrew ships a new release. Bump the
      # version and its SHA-256 together (sha256 of the release asset).
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: "0.63.1"
          SWIFTFORMAT_SHA256: "385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/swiftformat" --version)" = "$SWIFTFORMAT_VERSION"

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.1"
          SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/swiftlint"
          test "$("$RUNNER_TEMP/bin/swiftlint" version)" = "$SWIFTLINT_VERSION"

      - name: Check formatting
        run: make format-check

      - name: Run linter
        run: make lint
